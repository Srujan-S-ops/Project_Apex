spring.application.name=apex-engine
server.port=8765
server.address=127.0.0.1
server.shutdown=graceful
spring.main.banner-mode=off

# H2 file database (relative to the working directory: Backend/data in the game build)
spring.datasource.url=jdbc:h2:file:./data/apexdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# AI / sessions
apex.ai.threads=4
apex.ai.decision-timeout-ms=40
apex.session.idle-timeout-seconds=600
apex.connection.heartbeat-timeout-seconds=15
apex.standings.interval-ms=500

logging.file.name=logs/apex-engine.log
logging.level.root=INFO
logging.level.com.apex=INFO
